services:
  backend:
    build: ./backend
    environment:
      DATABASE_PATH: /data/route53.db
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - route53-data:/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  route53-data:
